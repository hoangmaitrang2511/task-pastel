<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bảng Task Pastel</title>
<script>try{const t=localStorage.getItem("tp-theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap">
<style>
/* Layout: project rail on the left, one focused task list on the right; rail turns into a chip strip on phones */
:root{
  --bg:#fbf7fa; --surface:#ffffff; --sunken:#f5eef3; --line:#eedfe8;
  --fg:#3b2f3a; --muted:#8a7a88;
  --pink:#f6bfd6; --pink-strong:#e28bb0; --pink-soft:#fde8f1;
  --blue:#bcdcf4; --blue-strong:#6fa9d6; --blue-soft:#e6f2fc;
  --mint:#c4ead8; --lav:#dccff3; --peach:#fbd9c4;
  --done:#74b99a; --warn:#e3a35c; --late:#d9677f; --on-accent:#ffffff; --on-pink:#3b2f3a;
  --font:"Lexend",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
/* Dark: soft charcoal with dimmed pastel accents */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1e1f26; --surface:#272832; --sunken:#30313c; --line:#3c3d4a;
  --fg:#eeedf4; --muted:#a8a7b6;
  --pink:#e2a7c2; --pink-strong:#f2bcd4; --pink-soft:#3b2d37;
  --blue:#93bde3; --blue-strong:#abd0f2; --blue-soft:#263548;
  --mint:#93cdb3; --lav:#baa9e3; --peach:#e8b797;
  --done:#93cdb3; --warn:#ebc08a; --late:#f19aad; --on-accent:#1e1f26; --on-pink:#1e1f26; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1e1f26; --surface:#272832; --sunken:#30313c; --line:#3c3d4a;
  --fg:#eeedf4; --muted:#a8a7b6;
  --pink:#e2a7c2; --pink-strong:#f2bcd4; --pink-soft:#3b2d37;
  --blue:#93bde3; --blue-strong:#abd0f2; --blue-soft:#263548;
  --mint:#93cdb3; --lav:#baa9e3; --peach:#e8b797;
  --done:#93cdb3; --warn:#ebc08a; --late:#f19aad; --on-accent:#1e1f26; --on-pink:#1e1f26; color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.5;font-weight:400;transition:background .2s}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue-strong);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:260px minmax(0,1fr);gap:28px;max-width:1120px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 48px}

/* rail */
.rail{display:flex;flex-direction:column;gap:6px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 20px);align-self:start}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:17px;padding:0 8px 14px}
.brand i{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--pink) 50%,var(--blue) 50%);display:block;flex:none}
.rail-label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:12px 10px 4px}
.pj{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;background:none;border-radius:11px;text-align:left}
.pj:hover{background:var(--sunken)}
.pj.on{background:var(--surface);box-shadow:0 0 0 1px var(--line)}
.pj .dot{width:10px;height:10px;border-radius:50%;flex:none}
.pj .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pj .pc{font-size:12px;color:var(--muted)}
.new-pj{display:flex;gap:6px;padding:6px 4px 0}
.new-pj input{flex:1;min-width:0;border:1px dashed var(--line);background:transparent;border-radius:10px;padding:8px 10px;font-size:14px}
.new-pj input:focus{border-style:solid;border-color:var(--pink-strong);outline:none}
.rail-foot{display:flex;flex-direction:column;gap:10px;padding:18px 6px 0;margin-top:8px;border-top:1px solid var(--line)}
.who{display:flex;align-items:center;gap:8px;font-size:13px}
.who .av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:12px;background:var(--pink);color:var(--on-pink);flex:none}
.who .nm{flex:1;min-width:0}
.who button{border:0;background:none;color:var(--muted);font-size:12px;padding:4px 6px;border-radius:7px}
.who button:hover{color:var(--fg);background:var(--sunken)}
.theme{display:flex;background:var(--sunken);border-radius:10px;padding:3px}
.theme button{flex:1;border:0;background:none;padding:5px 10px;border-radius:8px;font-size:12px;color:var(--muted)}
.theme button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.sync{font-size:12px;color:var(--muted)}

/* main */
main{min-width:0;display:flex;flex-direction:column;gap:22px}
.head{display:flex;flex-direction:column;gap:14px}
.head-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.head h1{margin:0;font-size:26px;font-weight:600;letter-spacing:-.01em;text-wrap:balance;flex:1;min-width:0}
.head h1 input{width:100%;border:0;background:none;font-weight:600;font-size:inherit;padding:0;letter-spacing:inherit}
.head h1 input:focus{outline:none;box-shadow:0 2px 0 var(--pink)}
.swatches{display:flex;gap:6px}
.sw{width:18px;height:18px;border-radius:50%;border:2px solid transparent;padding:0}
.sw.on{border-color:var(--fg)}
.ghost{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 12px;font-size:13px;color:var(--muted)}
.ghost:hover{color:var(--fg)}
.ghost.danger{color:var(--late);border-color:var(--late)}

.meter{display:flex;align-items:center;gap:14px}
.bar{flex:1;height:10px;border-radius:99px;background:var(--sunken);overflow:hidden}
.bar>span{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--pink),var(--blue));transition:width .35s ease}
.meter b{font-weight:600;font-size:20px;min-width:52px;text-align:right}
.counts{display:flex;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.counts span{display:inline-flex;align-items:center;gap:6px}
.counts i{width:8px;height:8px;border-radius:50%;display:inline-block}

.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.add{flex:1;min-width:220px;display:flex;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.add input{flex:1;min-width:0;border:0;background:none;padding:12px 14px}
.add input:focus{outline:none}
.add:focus-within{border-color:var(--pink-strong)}
.add button{border:0;background:var(--pink);color:var(--on-pink);padding:0 18px;font-weight:500}
.add button:hover{background:var(--pink-strong);color:var(--on-accent)}
.tabs{display:flex;background:var(--sunken);border-radius:12px;padding:3px}
.tabs button{border:0;background:none;padding:7px 12px;border-radius:9px;font-size:13px;color:var(--muted)}
.tabs button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.06)}

/* tasks */
.list{display:flex;flex-direction:column;gap:8px}
.task{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.task.done .t-title{text-decoration:line-through;color:var(--muted)}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;border-radius:var(--r)}
.row:hover{background:color-mix(in srgb,var(--sunken) 55%,transparent)}
.chk{width:22px;height:22px;flex:none;border-radius:50%;border:2px solid var(--blue-strong);background:none;display:grid;place-items:center;padding:0}
.chk.half{background:conic-gradient(var(--blue) var(--p),transparent 0)}
.chk.on{background:var(--done);border-color:var(--done)}
.chk.on::after{content:"";width:9px;height:5px;border:2px solid var(--on-accent);border-top:0;border-right:0;transform:translateY(-1px) rotate(-45deg)}
.t-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;border-radius:8px}
.t-title{font-weight:500;overflow-wrap:anywhere}
.meta{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.meta .late{color:var(--late)}
.meta .soon{color:var(--warn)}
.mini{width:56px;height:5px;border-radius:9px;background:var(--sunken);overflow:hidden;display:inline-block;vertical-align:middle}
.mini>span{display:block;height:100%;background:var(--blue-strong)}
.pill{border:0;border-radius:99px;padding:4px 10px;font-size:12px;font-weight:500;appearance:none;-webkit-appearance:none;text-align:center}
.pill.todo{background:var(--sunken);color:var(--muted)}
.pill.doing{background:var(--blue-soft);color:var(--blue-strong)}
.pill.done{background:color-mix(in srgb,var(--done) 22%,transparent);color:var(--done)}
.prio{font-size:11px;font-weight:600;letter-spacing:.04em;padding:2px 7px;border-radius:6px}
.prio.high{background:var(--pink-soft);color:var(--pink-strong)}
.icon-btn{border:0;background:none;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted);flex:none;padding:0}
.icon-btn:hover{background:var(--blue-soft);color:var(--blue-strong)}
.icon-btn svg{width:15px;height:15px}
.t-edit,.l-edit{flex:1;min-width:0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.t-edit input,.l-edit input{flex:1 1 180px;min-width:0;border:1px solid var(--pink-strong);background:var(--bg);border-radius:8px;padding:7px 10px;font-size:14px}
.l-edit input[name=label]{flex:1 1 120px;border-color:var(--line)}
.t-edit input:focus,.l-edit input:focus{outline:none;border-color:var(--blue-strong)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-size:13px;color:var(--muted)}
.btn:hover{color:var(--fg)}
.btn.primary{border-color:transparent;background:var(--pink);color:var(--on-pink);font-weight:500}
.btn.primary:hover{background:var(--pink-strong)}
.exp{width:24px;height:24px;display:grid;place-items:center;color:var(--muted);flex:none;transition:transform .2s;font-size:18px}
.task.open .exp{transform:rotate(90deg)}

.detail{border-top:1px dashed var(--line);padding:14px 14px 14px 48px;display:flex;flex-direction:column;gap:14px}
.d-title{border:0;border-bottom:1px solid var(--line);background:none;padding:4px 0;font-size:16px;font-weight:500;width:100%}
.d-title:focus{outline:none;border-color:var(--pink-strong)}
.d-label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.fields{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.fields label{display:flex;align-items:center;gap:6px}
.fields input,.fields select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:5px 8px;font-size:13px}
.subs{display:flex;flex-direction:column;gap:2px}
.sub{display:flex;align-items:center;gap:10px;padding:5px 6px 5px calc(6px + var(--d,0) * 26px);border-radius:8px;position:relative}
.sub[style*="--d:1"]::before,.sub[style*="--d:2"]::before{content:"";position:absolute;left:calc(var(--d) * 26px - 12px);top:0;bottom:0;border-left:1.5px solid var(--line)}
.sub:hover{background:var(--sunken)}
.sub input[type=checkbox]{width:17px;height:17px;accent-color:var(--pink-strong);flex:none;margin:0}
.sub .s-title{flex:1;min-width:0;border:0;background:none;padding:0;font-size:14px}
.sub .s-title:focus{outline:none;box-shadow:0 1px 0 var(--pink)}
.sub.done .s-title{text-decoration:line-through;color:var(--muted)}
.x{border:0;background:none;color:var(--muted);width:26px;height:26px;border-radius:7px;opacity:.6;flex:none}
.x:hover{opacity:1;color:var(--late);background:var(--pink-soft)}
.x.plus:hover{color:var(--blue-strong);background:var(--blue-soft)}
.sub .x,.sub .icon-btn{opacity:0}
.sub .icon-btn{width:26px;height:26px}
.sub:hover .icon-btn,.sub:focus-within .icon-btn{opacity:.8}
.sub:hover .x,.sub:focus-within .x{opacity:.6}
.sub:hover .x:hover{opacity:1}
@media (hover:none){.sub .x,.sub .icon-btn{opacity:.6}}
.sub-add{display:flex;gap:8px;padding-left:calc(var(--d,0) * 26px)}
.sub-add input{flex:1;min-width:0;border:0;border-bottom:1px solid var(--line);background:none;padding:6px 2px;font-size:14px}
.sub-add input:focus{outline:none;border-color:var(--blue-strong)}
.d-foot{display:flex;justify-content:flex-end}
.res{display:flex;flex-direction:column;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px}
.links{display:flex;flex-direction:column;gap:6px}
.link{display:flex;align-items:center;gap:10px;min-width:0}
.link a{flex:1;min-width:0;color:var(--fg);text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.link a:hover{text-decoration:underline;text-decoration-color:var(--pink-strong)}
.kind{flex:none;font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--sunken);color:var(--muted)}
.kind.sheet{background:var(--mint);color:var(--on-pink)}
.kind.doc{background:var(--blue);color:var(--on-pink)}
.kind.slide{background:var(--peach);color:var(--on-pink)}
.kind.drive,.kind.form{background:var(--lav);color:var(--on-pink)}
.kind.figma,.kind.notion,.kind.gh{background:var(--pink);color:var(--on-pink)}
.link-add{display:flex;gap:8px;flex-wrap:wrap}
.link-add input{flex:2 1 200px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;font-size:13px}
.link-add input[name=label]{flex:1 1 120px}
.link-add input:focus,.notes:focus{outline:none;border-color:var(--blue-strong)}
.link-add button{border:0;background:var(--blue);color:var(--on-pink);border-radius:8px;padding:7px 14px;font-size:13px;font-weight:500}
.link-err{font-size:12px;color:var(--late)}
.notes{width:100%;min-height:76px;resize:vertical;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;font:inherit;font-size:14px;line-height:1.5}

/* overview */
.ov{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;text-align:left}
.card:hover{border-color:var(--pink-strong)}
.card h3{margin:0;font-size:16px;font-weight:600;display:flex;align-items:center;gap:8px}
.card h3 .dot{width:10px;height:10px;border-radius:50%}
.card .counts{font-size:12px}
.sec-title{font-size:13px;font-weight:500;color:var(--muted);margin:6px 0 -6px}
.due-list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.due-list button{display:flex;gap:12px;align-items:center;border:0;background:none;padding:11px 14px;text-align:left;border-bottom:1px solid var(--line)}
.due-list button:last-child{border-bottom:0}
.due-list .nm{flex:1;min-width:0}
.due-list small{color:var(--muted)}

.cal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px}
.cal-head{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.cal-head h2{margin:0;font-size:16px;font-weight:600;flex:1;min-width:140px}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-wd{font-size:11px;color:var(--muted);text-align:center;letter-spacing:.06em;text-transform:uppercase;padding-bottom:2px}
.cal-cell{min-height:92px;min-width:0;border-radius:10px;padding:5px;background:var(--bg);display:flex;flex-direction:column;gap:3px;cursor:pointer;border:1.5px solid transparent}
.cal-cell:hover{border-color:var(--line)}
.cal-cell.out{opacity:.45}
.cal-cell.sel{border-color:var(--blue-strong)}
.cal-n{font-size:12px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;flex:none}
.cal-cell.today .cal-n{background:var(--pink);color:var(--on-pink);font-weight:600}
.cal-chip{display:block;width:100%;border:0;text-align:left;font-size:11px;line-height:1.5;padding:1px 6px;border-radius:6px;color:var(--fg);background:color-mix(in srgb,var(--c) 45%,var(--surface));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-chip.done{text-decoration:line-through;opacity:.55}
.cal-chip.late{box-shadow:inset 3px 0 0 var(--late)}
.cal-more{font-size:11px;color:var(--muted);padding-left:4px}
.day{display:flex;flex-direction:column;gap:8px;border-top:1px dashed var(--line);padding-top:12px}
.day h3{margin:0;font-size:14px;font-weight:600}
.day-item{display:flex;align-items:center;gap:10px;min-width:0}
.day-item .dot{width:9px;height:9px;border-radius:50%;flex:none}
.day-item .go{flex:1;min-width:0;border:0;background:none;text-align:left;padding:4px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day-item .go small{color:var(--muted)}
.day-item.done .go{text-decoration:line-through;color:var(--muted)}
.day-add{display:flex;gap:8px;flex-wrap:wrap}
.day-add select,.day-add input{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 10px;font-size:13px;min-width:0}
.day-add select{flex:0 1 180px}
.day-add input{flex:1 1 180px}
.day-add input:focus,.day-add select:focus{outline:none;border-color:var(--blue-strong)}
.gcal{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--blue-strong);text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:4px 10px;background:var(--surface);white-space:nowrap;flex:none}
.gcal:hover{border-color:var(--blue-strong)}
.gcal svg{width:13px;height:13px}
.gcal.icon{padding:5px}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:34px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:6px;align-items:center}
.empty b{color:var(--fg);font-weight:500}
.note{font-size:13px;color:var(--warn)}

/* login */
.login{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding-block:32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.login form{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:28px;display:flex;flex-direction:column;gap:18px}
.login h1{margin:0;font-size:22px;font-weight:600;display:flex;align-items:center;gap:10px}
.login p{margin:0;color:var(--muted);font-size:14px}
.people{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.person{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 8px;border:1.5px solid var(--line);border-radius:14px;background:var(--bg)}
.person .av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:18px;color:var(--on-pink)}
.person.on{border-color:var(--pink-strong);background:var(--pink-soft)}
.login label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.login input[type=password]{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:11px 12px;font-size:15px}
.login input[type=password]:focus{outline:none;border-color:var(--pink-strong)}
.login .go{border:0;background:var(--pink);color:var(--on-pink);border-radius:12px;padding:12px;font-weight:600}
.login .go:hover{background:var(--pink-strong);color:var(--on-accent)}
.login .go:disabled{opacity:.6;cursor:wait}
.login .err{color:var(--late);font-size:13px;min-height:1em}
.login .theme{align-self:center}

@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr);gap:18px;padding-block:16px 40px}
  .rail{position:static;flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px;align-items:center}
  .brand{padding:0 6px 0 0;flex:none}
  .brand span,.rail-label,.sync{display:none}
  .pj{width:auto;flex:none;padding:7px 12px;background:var(--surface);border:1px solid var(--line)}
  .pj .pc{display:none}
  .new-pj{padding:0;flex:none}
  .new-pj input{width:130px}
  .rail-foot{flex-direction:row;align-items:center;border:0;margin:0;padding:0;flex:none}
  .who .nm{display:none}
  .detail{padding-left:14px}
  .cal{padding:10px}
  .cal-grid{gap:3px}
  .cal-cell{min-height:54px;padding:4px;gap:2px}
  .cal-chip{font-size:0;height:5px;padding:0;border-radius:3px}
  .cal-more{display:none}
  .head h1{font-size:22px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="root"></div>

<script type="module">
import {FIREBASE_CONFIG, ACCOUNTS} from "./firebase-config.js";
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {initializeFirestore,persistentLocalCache,collection,doc,setDoc,deleteDoc,onSnapshot} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const COLORS={pink:"var(--pink)",blue:"var(--blue)",mint:"var(--mint)",lav:"var(--lav)",peach:"var(--peach)"};
const STATUS={todo:"Chưa làm",doing:"Đang làm",done:"Xong"};
const uid=()=>Math.random().toString(36).slice(2,10);
// Subtask nesting depth below a task: levels 0, 1 and 2 (subtask, sub-subtask, third layer).
const MAX_DEPTH=2;
const CAL_ICON=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>`;
const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const PENCIL=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>`;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const root=document.getElementById("root");

const S={projects:{},view:"overview",filter:"all",open:new Set(),adding:null,linkErr:{},editTask:null,editLink:null,calMonth:(()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),1)})(),calDay:ymd(new Date()),calProject:null,mode:"auth",note:"",armed:null,refocus:null,user:null,pick:Object.keys(ACCOUNTS)[0],loginErr:"",busy:false};
let auth=null,fs=null,unsub=null;

/* ---------- theme ---------- */
function currentTheme(){
  const t=document.documentElement.dataset.theme;
  return t||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
}
function setTheme(t){
  document.documentElement.dataset.theme=t;
  try{localStorage.setItem("tp-theme",t)}catch(e){}
  render();
}
const themeHtml=()=>{const t=currentTheme();return `<div class="theme" role="group" aria-label="Giao diện">
  <button type="button" class="${t==="light"?"on":""}" data-theme-set="light">Sáng</button>
  <button type="button" class="${t==="dark"?"on":""}" data-theme-set="dark">Tối</button></div>`};

/* ---------- progress ---------- */
function nodePct(n){
  const c=n.children||[];
  if(n.done||!c.length)return n.done?1:0;
  return c.reduce((a,x)=>a+nodePct(x),0)/c.length;
}
function taskPct(t){
  if(t.status==="done")return 1;
  const subs=t.subtasks||[];
  if(!subs.length)return t.status==="doing"?.5:0;
  return subs.reduce((a,x)=>a+nodePct(x),0)/subs.length;
}
function findSub(list,id){
  for(const n of list||[]){
    if(n.id===id)return n;
    const r=findSub(n.children,id);if(r)return r;
  }
  return null;
}
function removeSub(list,id){
  const i=list.findIndex(n=>n.id===id);
  if(i>=0){list.splice(i,1);return true}
  return list.some(n=>n.children&&removeSub(n.children,id));
}
function setDone(n,v){n.done=v;(n.children||[]).forEach(c=>setDone(c,v))}
function rollup(list){
  (list||[]).forEach(n=>{if(n.children&&n.children.length){rollup(n.children);n.done=n.children.every(c=>c.done)}});
}
function linkKind(u){
  try{
    const x=new URL(u),h=x.hostname.replace(/^www\./,""),p=x.pathname;
    if(h==="docs.google.com"){
      if(p.startsWith("/spreadsheets"))return ["sheet","Sheet"];
      if(p.startsWith("/document"))return ["doc","Docs"];
      if(p.startsWith("/presentation"))return ["slide","Slides"];
      if(p.startsWith("/forms"))return ["form","Form"];
    }
    if(h==="drive.google.com")return ["drive","Drive"];
    if(h.endsWith("figma.com"))return ["figma","Figma"];
    if(h.endsWith("notion.so")||h.endsWith("notion.site"))return ["notion","Notion"];
    if(h==="github.com")return ["gh","GitHub"];
    return ["web",h];
  }catch(e){return ["web","Link"]}
}
function flatSubs(list,depth=0){
  return (list||[]).flatMap(n=>[`${"  ".repeat(depth)}${n.done?"[x]":"[ ]"} ${n.title}`,...flatSubs(n.children,depth+1)]);
}
function gcalUrl(p,t){
  const start=t.due.replace(/-/g,""),nx=new Date(t.due+"T00:00:00");nx.setDate(nx.getDate()+1);
  const lines=[`Dự án: ${p.name}`];
  const subs=flatSubs(t.subtasks);if(subs.length)lines.push("","Sub-task:",...subs);
  if((t.links||[]).length)lines.push("","Tài liệu:",...t.links.map(l=>(l.label?l.label+": ":"")+l.url));
  if(t.notes)lines.push("","Ghi chú:",t.notes.slice(0,600));
  const q=new URLSearchParams({action:"TEMPLATE",text:t.title,dates:`${start}/${ymd(nx).replace(/-/g,"")}`,details:lines.join("\n")});
  return "https://calendar.google.com/calendar/render?"+q.toString();
}
const gcalLink=(p,t,iconOnly)=>t.due?`<a class="gcal ${iconOnly?"icon":""}" href="${esc(gcalUrl(p,t))}" target="_blank" rel="noopener noreferrer" title="Thêm vào Google Calendar" aria-label="Thêm vào Google Calendar">${CAL_ICON}${iconOnly?"":"Thêm vào Google Calendar"}</a>`:"";
function calendarHtml(ps){
  const m=S.calMonth,y=m.getFullYear(),mo=m.getMonth();
  const offset=(new Date(y,mo,1).getDay()+6)%7,dim=new Date(y,mo+1,0).getDate(),weeks=Math.ceil((offset+dim)/7);
  const byDay={};
  ps.forEach(p=>(p.tasks||[]).forEach(t=>{if(t.due)(byDay[t.due]=byDay[t.due]||[]).push({p,t})}));
  Object.values(byDay).forEach(a=>a.sort((x,z)=>(x.t.status==="done")-(z.t.status==="done")));
  const todayKey=ymd(new Date());
  const cells=[];
  for(let i=0;i<weeks*7;i++){
    const d=new Date(y,mo,1-offset+i),key=ymd(d),items=byDay[key]||[];
    cells.push(`<div class="cal-cell ${d.getMonth()!==mo?"out":""} ${key===todayKey?"today":""} ${key===S.calDay?"sel":""}" data-day="${key}" role="button" tabindex="0" aria-label="Ngày ${d.getDate()}/${d.getMonth()+1}, ${items.length} task">
      <span class="cal-n num">${d.getDate()}</span>
      ${items.slice(0,3).map(({p,t})=>`<button class="cal-chip ${t.status==="done"?"done":key<todayKey?"late":""}" style="--c:${COLORS[p.color]||COLORS.pink}" data-go="${p.id}" data-openTask="${t.id}" title="${esc(t.title)} · ${esc(p.name)}">${esc(t.title)}</button>`).join("")}
      ${items.length>3?`<span class="cal-more">+${items.length-3} task</span>`:""}
    </div>`);
  }
  const sel=new Date(S.calDay+"T00:00:00"),dayItems=byDay[S.calDay]||[];
  if(!S.calProject||!S.projects[S.calProject])S.calProject=ps[0]?ps[0].id:null;
  const wd=["T2","T3","T4","T5","T6","T7","CN"];
  return `<section class="cal" aria-label="Lịch">
    <div class="cal-head">
      <h2 class="num">Tháng ${mo+1}, ${y}</h2>
      <button class="btn" data-cal="today">Hôm nay</button>
      <button class="icon-btn" data-cal="prev" aria-label="Tháng trước">‹</button>
      <button class="icon-btn" data-cal="next" aria-label="Tháng sau">›</button>
    </div>
    <div class="cal-grid">${wd.map(x=>`<div class="cal-wd">${x}</div>`).join("")}${cells.join("")}</div>
    <div class="day">
      <h3>${sel.toLocaleDateString("vi-VN",{weekday:"long",day:"2-digit",month:"2-digit",year:"numeric"})}</h3>
      ${dayItems.length?dayItems.map(({p,t})=>`<div class="day-item ${t.status==="done"?"done":""}">
          <span class="dot" style="background:${COLORS[p.color]||COLORS.pink}"></span>
          <button class="go" data-go="${p.id}" data-openTask="${t.id}">${esc(t.title)} <small>· ${esc(p.name)}</small></button>
          ${gcalLink(p,t,true)}
        </div>`).join(""):`<span class="sync">Chưa có task nào hạn vào ngày này.</span>`}
      ${ps.length?`<form class="day-add" data-dayadd>
        <select id="calPj" aria-label="Dự án">${ps.map(p=>`<option value="${p.id}" ${p.id===S.calProject?"selected":""}>${esc(p.name)}</option>`).join("")}</select>
        <input id="calTask" data-keep="caltask" placeholder="Thêm task cho ngày này…" autocomplete="off" aria-label="Task mới cho ngày đã chọn">
        <button type="submit" class="btn primary">Thêm</button>
      </form>`:""}
    </div>
  </section>`;
}
function normalizeUrl(raw){
  let v=raw.trim();if(!v)return null;
  if(!/^https?:\/\//i.test(v))v="https://"+v;
  try{const x=new URL(v);if(!/^https?:$/.test(x.protocol)||!x.hostname.includes("."))return null;return x.href}catch(e){return null}
}
function projStats(p){
  const ts=p.tasks||[];
  const c={todo:0,doing:0,done:0};ts.forEach(t=>c[t.status||"todo"]++);
  const pct=ts.length?ts.reduce((a,t)=>a+taskPct(t),0)/ts.length:0;
  return {...c,total:ts.length,pct:Math.round(pct*100)};
}
function dueInfo(d,status){
  if(!d)return null;
  const today=new Date();today.setHours(0,0,0,0);
  const days=Math.round((new Date(d+"T00:00:00")-today)/864e5);
  const label=new Date(d+"T00:00:00").toLocaleDateString("vi-VN",{day:"2-digit",month:"2-digit"});
  if(status==="done")return {cls:"",text:label,days};
  if(days<0)return {cls:"late",text:`Trễ ${-days} ngày`,days};
  if(days===0)return {cls:"soon",text:"Hôm nay",days};
  if(days<=2)return {cls:"soon",text:`Còn ${days} ngày`,days};
  return {cls:"",text:label,days};
}
const sorted=()=>Object.values(S.projects).sort((a,b)=>(a.order??0)-(b.order??0)||String(a.name).localeCompare(b.name));

/* ---------- persistence ---------- */
const pending=new Map(), saving=new Set();
const projRef=pid=>doc(fs,"users",S.user.uid,"projects",pid);
function scheduleSave(pid){
  clearTimeout(pending.get(pid));
  pending.set(pid,setTimeout(()=>flush(pid),350));
}
async function flush(pid){
  pending.delete(pid);
  if(!S.user)return;
  if(saving.has(pid)){scheduleSave(pid);return}
  saving.add(pid);
  try{
    const p=S.projects[pid];
    if(p) await setDoc(projRef(pid),stripId(p)); else await deleteDoc(projRef(pid));
  }catch(e){
    S.note=e&&e.code==="permission-denied"?"Không có quyền lưu. Hãy đăng nhập lại.":"Chưa lưu được, sẽ thử lại khi bạn sửa tiếp.";
    render();
  }finally{saving.delete(pid)}
}
const stripId=p=>{const {id,...rest}=p;return JSON.parse(JSON.stringify(rest))};

function mutate(pid,fn){
  const p=structuredClone(S.projects[pid]);fn(p);p.updatedAt=Date.now();
  S.projects[pid]=p;render();scheduleSave(pid);
}
function createProject(name){
  if(!name.trim())return;
  const id=uid(),keys=Object.keys(COLORS);
  const order=Math.max(0,...Object.values(S.projects).map(p=>p.order??0))+1;
  S.projects[id]={id,name:name.trim(),color:keys[Object.keys(S.projects).length%keys.length],order,tasks:[],createdAt:Date.now()};
  S.view=id;S.refocus="#newTask";render();scheduleSave(id);
}
function removeProject(pid){delete S.projects[pid];S.view="overview";render();scheduleSave(pid)}

/* ---------- render ---------- */
function render(){
  const ae=document.activeElement;
  const keep=ae&&ae.dataset&&ae.dataset.keep?ae.dataset.keep:null;
  const caret=keep&&ae.selectionStart!=null?[ae.value,ae.selectionStart]:null;
  if(S.mode==="auth"||S.mode==="login")renderLogin();
  else{
    if(!document.getElementById("rail"))root.innerHTML=`<div class="app"><nav class="rail" id="rail" aria-label="Dự án"></nav><main id="main"></main></div>`;
    renderRail();renderMain();
  }
  const target=S.refocus?document.querySelector(S.refocus):keep?document.querySelector(`[data-keep="${keep}"]`):null;
  if(target){target.focus();if(caret&&!S.refocus&&target.value===caret[0])try{target.setSelectionRange(caret[1],caret[1])}catch(e){}}
  S.refocus=null;
}
const initial=n=>esc(String(n).slice(0,1).toUpperCase());
const avatarBg=n=>n===Object.keys(ACCOUNTS)[1]?"var(--blue)":"var(--pink)";
function renderLogin(){
  if(S.mode==="auth"){root.innerHTML=`<div class="login"><div class="empty"><b>Đang mở…</b></div></div>`;return}
  const pwd=document.getElementById("pwd");const keepPwd=pwd?pwd.value:"";
  root.innerHTML=`<div class="login"><form id="loginForm">
    <h1><span class="brand" style="padding:0"><i></i></span>Task Pastel</h1>
    <p>Chọn tài khoản của bạn và nhập mật khẩu.</p>
    <div class="people" role="radiogroup" aria-label="Tài khoản">${Object.keys(ACCOUNTS).map(n=>`
      <button type="button" class="person ${S.pick===n?"on":""}" data-pick="${esc(n)}" role="radio" aria-checked="${S.pick===n}">
        <span class="av" style="background:${avatarBg(n)}">${initial(n)}</span>${esc(n)}</button>`).join("")}</div>
    <label>Mật khẩu<input type="password" id="pwd" data-keep="pwd" autocomplete="current-password" required></label>
    <div class="err" role="alert">${esc(S.loginErr)}</div>
    <button class="go" type="submit" ${S.busy?"disabled":""}>${S.busy?"Đang đăng nhập…":"Đăng nhập"}</button>
    ${themeHtml()}
  </form></div>`;
  document.getElementById("pwd").value=keepPwd;
}
function renderRail(){
  const ps=sorted(),name=S.user?.name||"";
  document.getElementById("rail").innerHTML=`
    <div class="brand"><i></i><span>Task Pastel</span></div>
    <button class="pj ${S.view==="overview"?"on":""}" data-go="overview"><span class="dot" style="background:linear-gradient(135deg,var(--pink) 50%,var(--blue) 50%)"></span><span class="nm">Tổng quan</span></button>
    <div class="rail-label">Dự án</div>
    ${ps.map(p=>`<button class="pj ${S.view===p.id?"on":""}" data-go="${p.id}"><span class="dot" style="background:${COLORS[p.color]||COLORS.pink}"></span><span class="nm">${esc(p.name)}</span><span class="pc num">${projStats(p).pct}%</span></button>`).join("")}
    <form class="new-pj" id="newPj"><input id="newPjName" data-keep="newpj" placeholder="+ Dự án mới" aria-label="Tên dự án mới" autocomplete="off"></form>
    <div class="rail-foot">
      <div class="who"><span class="av" style="background:${avatarBg(name)}">${initial(name)}</span><span class="nm">${esc(name)}</span><button data-logout>Đăng xuất</button></div>
      ${themeHtml()}
      <div class="sync">${S.mode==="ready"?"Đã đồng bộ, dùng được trên mọi máy":"Đang tải…"}</div>
    </div>`;
}
function renderMain(){
  const m=document.getElementById("main");
  if(S.mode==="loading"){m.innerHTML=`<div class="empty"><b>Đang tải dự án…</b><span>${esc(S.note)}</span></div>`;return}
  const p=S.projects[S.view];
  m.innerHTML=(S.note?`<div class="note">${esc(S.note)}</div>`:"")+(p?projectView(p):overview());
}
function overview(){
  const ps=sorted();
  if(!ps.length)return `<div class="head"><div class="head-top"><h1>Chào ${esc(S.user?.name||"")}</h1></div></div>
    <div class="empty"><b>Chưa có dự án nào</b><span>Gõ tên dự án vào ô “+ Dự án mới” ở thanh bên rồi nhấn Enter để bắt đầu.</span></div>`;
  let all={todo:0,doing:0,done:0,total:0},sum=0;
  ps.forEach(p=>{const s=projStats(p);all.todo+=s.todo;all.doing+=s.doing;all.done+=s.done;all.total+=s.total;sum+=(p.tasks||[]).reduce((a,t)=>a+taskPct(t),0)});
  const pct=all.total?Math.round(sum/all.total*100):0;
  const upcoming=ps.flatMap(p=>(p.tasks||[]).filter(t=>t.due&&t.status!=="done").map(t=>({p,t,d:dueInfo(t.due,t.status)}))).sort((a,b)=>a.d.days-b.d.days).slice(0,6);
  return `<div class="head">
      <div class="head-top"><h1>Tổng quan</h1></div>
      <div class="meter"><div class="bar"><span style="width:${pct}%"></span></div><b class="num">${pct}%</b></div>
      ${countsHtml(all)}
    </div>
    <div class="ov">${ps.map(p=>{const s=projStats(p);return `<button class="card" data-go="${p.id}">
        <h3><span class="dot" style="background:${COLORS[p.color]}"></span>${esc(p.name)}</h3>
        <div class="meter"><div class="bar"><span style="width:${s.pct}%"></span></div><b class="num" style="font-size:15px">${s.pct}%</b></div>
        ${countsHtml(s)}</button>`}).join("")}</div>
    ${calendarHtml(ps)}
    ${upcoming.length?`<div class="sec-title">Sắp đến hạn</div><div class="due-list">${upcoming.map(({p,t,d})=>`<button data-go="${p.id}" data-openTask="${t.id}">
        <span class="dot" style="width:8px;height:8px;border-radius:50%;background:${COLORS[p.color]}"></span>
        <span class="nm">${esc(t.title)} <small>· ${esc(p.name)}</small></span><small style="${d.cls?`color:var(--${d.cls==="late"?"late":"warn"})`:""}">${d.text}</small></button>`).join("")}</div>`:""}`;
}
function countsHtml(s){
  return `<div class="counts num"><span><i style="background:var(--muted)"></i>${s.todo} chưa làm</span><span><i style="background:var(--blue-strong)"></i>${s.doing} đang làm</span><span><i style="background:var(--done)"></i>${s.done} xong</span></div>`;
}
function projectView(p){
  const s=projStats(p);
  let ts=(p.tasks||[]).map((t,i)=>({t,i}));
  if(S.filter!=="all")ts=ts.filter(x=>(x.t.status||"todo")===S.filter);
  ts.sort((a,b)=>(a.t.status==="done")-(b.t.status==="done")||(b.t.priority==="high")-(a.t.priority==="high")||a.i-b.i);
  const tabs=[["all","Tất cả",s.total],["todo","Chưa làm",s.todo],["doing","Đang làm",s.doing],["done","Xong",s.done]];
  return `<div class="head">
      <div class="head-top">
        <h1><input id="pjName" data-keep="pjname" value="${esc(p.name)}" aria-label="Tên dự án"></h1>
        <div class="swatches">${Object.keys(COLORS).map(k=>`<button class="sw ${p.color===k?"on":""}" style="background:${COLORS[k]}" data-color="${k}" aria-label="Màu ${k}"></button>`).join("")}</div>
        <button class="ghost ${S.armed==="pj"?"danger":""}" data-delpj>${S.armed==="pj"?"Bấm lần nữa để xoá":"Xoá dự án"}</button>
      </div>
      <div class="meter"><div class="bar"><span style="width:${s.pct}%"></span></div><b class="num">${s.pct}%</b></div>
      ${countsHtml(s)}
    </div>
    <div class="tools">
      <form class="add" id="addTask"><input id="newTask" data-keep="newtask" placeholder="Thêm task mới…" autocomplete="off" aria-label="Task mới"><button type="submit">Thêm</button></form>
      <div class="tabs" role="tablist">${tabs.map(([k,l,n])=>`<button class="${S.filter===k?"on":""}" data-filter="${k}">${l} <span class="num">${n}</span></button>`).join("")}</div>
    </div>
    <div class="list">${ts.length?ts.map(x=>taskHtml(x.t)).join(""):
      `<div class="empty"><b>${s.total?"Không có task ở mục này":"Dự án chưa có task"}</b><span>${s.total?"Đổi bộ lọc để xem các task khác.":"Gõ vào ô “Thêm task mới” rồi nhấn Enter."}</span></div>`}</div>`;
}
function subsHtml(list,depth,tid){
  return (list||[]).map(x=>`<div class="sub ${x.done?"done":""}" data-sub="${x.id}" style="--d:${depth}">
      <input type="checkbox" ${x.done?"checked":""} data-subtoggle aria-label="Xong">
      <input class="s-title" id="st-${x.id}" data-keep="st-${x.id}" value="${esc(x.title)}" data-subtitle aria-label="Tên subtask">
      <button class="icon-btn" data-subedit aria-label="Sửa sub-task" title="Sửa sub-task">${PENCIL}</button>
      ${depth<MAX_DEPTH?`<button class="x plus" data-subchild aria-label="Thêm sub-task con" title="Thêm sub-task con">+</button>`:""}
      <button class="x" data-subdel aria-label="Xoá" title="Xoá">✕</button>
    </div>
    ${subsHtml(x.children,depth+1,tid)}
    ${S.adding===x.id?`<form class="sub-add" data-subadd data-parent="${x.id}" style="--d:${depth+1}"><input id="sa-${x.id}" data-keep="sa-${x.id}" placeholder="+ Sub-task con, nhấn Enter (Esc để đóng)" autocomplete="off" aria-label="Sub-task con mới"></form>`:""}`).join("");
}
function taskHtml(t){
  const subs=t.subtasks||[],nd=subs.filter(x=>x.done).length,pct=taskPct(t),open=S.open.has(t.id),d=dueInfo(t.due,t.status);
  const st=t.status||"todo",links=t.links||[];
  return `<div class="task ${st==="done"?"done":""} ${open?"open":""}" data-task="${t.id}">
    <div class="row" data-row>
      <button class="chk ${st==="done"?"on":pct>0?"half":""}" style="--p:${Math.round(pct*100)}%" data-toggle aria-label="Đánh dấu xong"></button>
      ${S.editTask===t.id?`<form class="t-edit" data-taskedit>
        <input id="te-${t.id}" class="te-input" data-keep="te-${t.id}" name="title" value="${esc(t.title)}" aria-label="Tên task" autocomplete="off">
        <button type="submit" class="btn primary">Lưu</button><button type="button" class="btn" data-editcancel>Huỷ</button>
      </form>`:`      <div class="t-main" role="button" tabindex="0" aria-expanded="${open}" data-expand-key>
        <span class="t-title">${esc(t.title)}</span>
        <div class="meta num">
          ${t.priority==="high"?`<span class="prio high">ƯU TIÊN</span>`:""}
          ${subs.length?`<span><span class="mini"><span style="width:${pct*100}%"></span></span> ${nd}/${subs.length}</span>`:""}
          ${d?`<span class="${d.cls}">${d.text}</span>`:""}
          ${links.length?`<span>${links.length} link</span>`:""}
          ${t.notes?`<span>Có ghi chú</span>`:""}
        </div>
      </div>
      <button class="icon-btn" data-taskedit-open aria-label="Sửa tên task" title="Sửa tên task">${PENCIL}</button>`}
      <select class="pill ${st}" data-field="status" aria-label="Trạng thái">${Object.entries(STATUS).map(([k,l])=>`<option value="${k}" ${st===k?"selected":""}>${l}</option>`).join("")}</select>
      <span class="exp" aria-hidden="true">›</span>
    </div>
    ${open?`<div class="detail">
      <div class="fields">
        <label>Hạn <input type="date" data-field="due" value="${esc(t.due||"")}"></label>
        <label>Ưu tiên <select data-field="priority"><option value="normal">Bình thường</option><option value="high" ${t.priority==="high"?"selected":""}>Cao</option></select></label>
        ${gcalLink(S.projects[S.view],t,false)}
      </div>
      <div class="d-label">Sub-task</div>
      <div class="subs">${subsHtml(subs,0,t.id)}</div>
      <form class="sub-add" data-subadd data-parent=""><input id="sa-${t.id}" data-keep="sa-${t.id}" placeholder="+ Thêm sub-task, nhấn Enter" autocomplete="off" aria-label="Sub-task mới"></form>
      <div class="res">
        <div class="d-label">Tài liệu & dữ liệu</div>
        ${links.length?`<div class="links">${links.map(l=>{const [k,kn]=linkKind(l.url);return S.editLink===l.id?`<div class="link" data-link="${l.id}">
            <form class="l-edit" data-linkedit>
              <input name="url" id="le-${l.id}" class="le-input" data-keep="le-${l.id}" value="${esc(l.url)}" aria-label="Link" autocomplete="off">
              <input name="label" class="le-input" data-keep="lel-${l.id}" value="${esc(l.label||"")}" placeholder="Tên hiển thị (tuỳ chọn)" aria-label="Tên link" autocomplete="off">
              <button type="submit" class="btn primary">Lưu</button><button type="button" class="btn" data-editcancel>Huỷ</button>
            </form></div>`:`<div class="link" data-link="${l.id}">
            <span class="kind ${k}">${esc(kn)}</span>
            <a href="${esc(l.url)}" target="_blank" rel="noopener noreferrer" title="${esc(l.url)}">${esc(l.label||l.url)}</a>
            <button class="icon-btn" data-linkedit-open aria-label="Sửa link" title="Sửa link">${PENCIL}</button>
            <button class="x" data-linkdel aria-label="Xoá link" title="Xoá link">✕</button></div>`}).join("")}</div>`:""}
        <form class="link-add" data-linkadd>
          <input name="url" id="lu-${t.id}" data-keep="lu-${t.id}" placeholder="Dán link Google Sheet, Drive, Docs…" autocomplete="off" aria-label="Link">
          <input name="label" data-keep="ll-${t.id}" placeholder="Tên hiển thị (tuỳ chọn)" autocomplete="off" aria-label="Tên link">
          <button type="submit">Lưu link</button>
        </form>
        ${S.linkErr[t.id]?`<div class="link-err">${esc(S.linkErr[t.id])}</div>`:""}
        <textarea class="notes" data-field="notes" data-keep="nt-${t.id}" placeholder="Ghi chú, số liệu, thông tin cần lưu cho task này…" aria-label="Ghi chú">${esc(t.notes||"")}</textarea>
      </div>
      <div class="d-foot"><button class="ghost ${S.armed===t.id?"danger":""}" data-deltask>${S.armed===t.id?"Bấm lần nữa để xoá":"Xoá task"}</button></div>
    </div>`:""}
  </div>`;
}

/* ---------- events ---------- */
const findTask=(p,id)=>p.tasks.find(t=>t.id===id);
function syncStatusFromSubs(t){
  const subs=t.subtasks||[];if(!subs.length)return;
  rollup(subs);
  const pct=subs.reduce((a,x)=>a+nodePct(x),0)/subs.length;
  if(pct>=1)t.status="done";
  else if(pct>0)t.status="doing";
  else if(t.status==="done")t.status="doing";
}
function selectDay(key){
  S.calDay=key;const d=new Date(key+"T00:00:00");
  if(d.getMonth()!==S.calMonth.getMonth()||d.getFullYear()!==S.calMonth.getFullYear())S.calMonth=new Date(d.getFullYear(),d.getMonth(),1);
  render();
}
function toggleExpand(tid){
  S.open.has(tid)?S.open.delete(tid):S.open.add(tid);S.armed=null;S.adding=null;render();
}
document.addEventListener("click",e=>{
  const el=e.target.closest("button");
  if(!el){
    const cell=e.target.closest("[data-day]");
    if(cell){selectDay(cell.dataset.day);return}
    const row=e.target.closest("[data-row]");
    if(row&&!e.target.closest("input,select,a,textarea,form"))toggleExpand(row.closest("[data-task]").dataset.task);
    return;
  }
  if(el.dataset.cal){
    const c=el.dataset.cal,m=S.calMonth;
    if(c==="today"){const d=new Date();S.calMonth=new Date(d.getFullYear(),d.getMonth(),1);S.calDay=ymd(d)}
    else S.calMonth=new Date(m.getFullYear(),m.getMonth()+(c==="next"?1:-1),1);
    render();return}
  if(el.dataset.themeSet){setTheme(el.dataset.themeSet);return}
  if(el.dataset.pick){S.pick=el.dataset.pick;S.loginErr="";S.refocus="#pwd";render();return}
  if("logout" in el.dataset){(async()=>{const ids=[...pending.keys()];ids.forEach(id=>clearTimeout(pending.get(id)));await Promise.all(ids.map(flush));signOut(auth)})();return}
  const go=el.dataset.go;
  if(go){S.view=go;S.filter="all";S.armed=null;if(el.dataset.opentask)S.open.add(el.dataset.opentask);render();return}
  if(el.dataset.filter){S.filter=el.dataset.filter;render();return}
  const pid=S.view,taskEl=el.closest("[data-task]"),tid=taskEl&&taskEl.dataset.task;
  if(el.dataset.color){mutate(pid,p=>p.color=el.dataset.color);return}
  if("delpj" in el.dataset){if(S.armed==="pj")removeProject(pid);else{S.armed="pj";render()}return}
  if("toggle" in el.dataset){mutate(pid,p=>{const t=findTask(p,tid);const done=t.status!=="done";t.status=done?"done":"todo";if(done)(t.subtasks||[]).forEach(s=>setDone(s,true))});return}
  if("taskeditOpen" in el.dataset){S.editTask=tid;S.editLink=null;S.refocus="#te-"+tid;render();const i=document.getElementById("te-"+tid);if(i)i.select();return}
  if("linkeditOpen" in el.dataset){const lid=el.closest("[data-link]").dataset.link;S.editLink=lid;S.editTask=null;delete S.linkErr[tid];S.refocus="#le-"+lid;render();return}
  if("editcancel" in el.dataset){S.editTask=null;S.editLink=null;delete S.linkErr[tid];render();return}
  if("subedit" in el.dataset){const i=el.closest("[data-sub]").querySelector(".s-title");i.focus();i.select();return}
  if("subchild" in el.dataset){const sid=el.closest("[data-sub]").dataset.sub;S.adding=S.adding===sid?null:sid;S.refocus="#sa-"+sid;render();return}
  if("linkdel" in el.dataset){const lid=el.closest("[data-link]").dataset.link;mutate(pid,p=>{const t=findTask(p,tid);t.links=(t.links||[]).filter(l=>l.id!==lid)});return}
  if("deltask" in el.dataset){if(S.armed===tid){S.armed=null;S.open.delete(tid);mutate(pid,p=>p.tasks=p.tasks.filter(t=>t.id!==tid))}else{S.armed=tid;render()}return}
  if("subdel" in el.dataset){const sid=el.closest("[data-sub]").dataset.sub;if(S.adding===sid)S.adding=null;mutate(pid,p=>{const t=findTask(p,tid);removeSub(t.subtasks,sid);syncStatusFromSubs(t)});return}
});
document.addEventListener("submit",async e=>{
  e.preventDefault();const f=e.target;
  if(f.id==="loginForm"){
    const pwd=document.getElementById("pwd").value;
    if(!pwd||S.busy)return;
    S.busy=true;S.loginErr="";render();
    try{await signInWithEmailAndPassword(auth,ACCOUNTS[S.pick],pwd)}
    catch(err){
      const c=err&&err.code||"";
      S.loginErr=c.includes("invalid-credential")||c.includes("wrong-password")||c.includes("user-not-found")?"Sai mật khẩu. Hãy thử lại."
        :c.includes("too-many-requests")?"Nhập sai quá nhiều lần. Đợi vài phút rồi thử lại."
        :c.includes("network")?"Không có mạng. Kiểm tra kết nối rồi thử lại."
        :"Chưa đăng nhập được ("+c+").";
      S.busy=false;S.refocus="#pwd";render();
      const p=document.getElementById("pwd");if(p)p.value="";
    }
    return;
  }
  if(f.id==="newPj"){const i=f.querySelector("input");const v=i.value;i.value="";createProject(v);return}
  if(f.id==="addTask"){const i=f.querySelector("input"),v=i.value.trim();if(!v)return;i.value="";S.filter=S.filter==="done"?"all":S.filter;
    S.refocus="#newTask";mutate(S.view,p=>p.tasks.unshift({id:uid(),title:v,status:"todo",priority:"normal",due:"",subtasks:[],createdAt:Date.now()}));return}
  if("subadd" in f.dataset){const i=f.querySelector("input"),v=i.value.trim(),tid=f.closest("[data-task]").dataset.task,parent=f.dataset.parent;if(!v)return;i.value="";
    S.refocus="#sa-"+(parent||tid);
    mutate(S.view,p=>{const t=findTask(p,tid);t.subtasks=t.subtasks||[];
      const host=parent?findSub(t.subtasks,parent):null;
      (host?(host.children=host.children||[]):t.subtasks).push({id:uid(),title:v,done:false,children:[]});
      syncStatusFromSubs(t)});
    return}
  if("dayadd" in f.dataset){const v=f.elements[1].value.trim(),pid=f.elements[0].value;if(!v||!S.projects[pid])return;
    S.calProject=pid;f.elements[1].value="";S.refocus="#calTask";
    mutate(pid,p=>p.tasks.unshift({id:uid(),title:v,status:"todo",priority:"normal",due:S.calDay,subtasks:[],createdAt:Date.now()}));
    return}
  if("taskedit" in f.dataset){const tid=f.closest("[data-task]").dataset.task,v=f.elements.title.value.trim();
    S.editTask=null;
    if(v&&v!==findTask(S.projects[S.view],tid).title)mutate(S.view,p=>{findTask(p,tid).title=v});else render();
    return}
  if("linkedit" in f.dataset){const tid=f.closest("[data-task]").dataset.task,lid=f.closest("[data-link]").dataset.link;
    const url=normalizeUrl(f.elements.url.value),label=f.elements.label.value.trim();
    if(!url){S.linkErr[tid]="Link chưa hợp lệ. Hãy dán đầy đủ địa chỉ, ví dụ https://docs.google.com/…";S.refocus="#le-"+lid;render();return}
    S.editLink=null;delete S.linkErr[tid];
    mutate(S.view,p=>{const l=(findTask(p,tid).links||[]).find(x=>x.id===lid);if(l){l.url=url;l.label=label}});
    return}
  if("linkadd" in f.dataset){const tid=f.closest("[data-task]").dataset.task,raw=f.elements.url.value,label=f.elements.label.value.trim();
    if(!raw.trim())return;
    const url=normalizeUrl(raw);
    if(!url){S.linkErr[tid]="Link chưa hợp lệ. Hãy dán đầy đủ địa chỉ, ví dụ https://docs.google.com/…";S.refocus="#lu-"+tid;render();return}
    delete S.linkErr[tid];f.elements.url.value="";f.elements.label.value="";S.refocus="#lu-"+tid;
    mutate(S.view,p=>{const t=findTask(p,tid);(t.links=t.links||[]).push({id:uid(),url,label})});
    return}
});
document.addEventListener("change",e=>{
  const el=e.target,pid=S.view;
  if(!S.user)return;
  if(el.id==="calPj"){S.calProject=el.value;return}
  if(el.id==="pjName"){const v=el.value.trim();if(v)mutate(pid,p=>p.name=v);else render();return}
  const taskEl=el.closest("[data-task]");if(!taskEl)return;const tid=taskEl.dataset.task;
  if("subtoggle" in el.dataset){const sid=el.closest("[data-sub]").dataset.sub;mutate(pid,p=>{const t=findTask(p,tid);setDone(findSub(t.subtasks,sid),el.checked);syncStatusFromSubs(t)});return}
  if("subtitle" in el.dataset){const sid=el.closest("[data-sub]").dataset.sub,v=el.value.trim();mutate(pid,p=>{const t=findTask(p,tid);if(v)findSub(t.subtasks,sid).title=v});return}
  const f=el.dataset.field;if(!f)return;
  const v=f==="title"?el.value.trim():el.value;if(f==="title"&&!v){render();return}
  if(f==="notes"&&v===(findTask(S.projects[pid],tid).notes||""))return;
  mutate(pid,p=>{const t=findTask(p,tid);t[f]=v;if(f==="status"&&v==="done")(t.subtasks||[]).forEach(s=>setDone(s,true))});
});
document.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&e.target.matches(".d-title,.s-title,#pjName"))e.target.blur();
  if((e.key==="Enter"||e.key===" ")&&e.target.matches("[data-day]")){e.preventDefault();selectDay(e.target.dataset.day);return}
  if((e.key==="Enter"||e.key===" ")&&e.target.matches("[data-expand-key]")){e.preventDefault();toggleExpand(e.target.closest("[data-task]").dataset.task)}
  if(e.key==="Escape"&&S.adding&&e.target.closest("[data-subadd]")){S.adding=null;render()}
  if(e.key==="Escape"&&(S.editTask||S.editLink)&&e.target.closest("[data-taskedit],[data-linkedit]")){S.editTask=null;S.editLink=null;render()}
});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{if(!document.documentElement.dataset.theme)render()});

/* ---------- boot ---------- */
function startData(user){
  const name=Object.keys(ACCOUNTS).find(n=>ACCOUNTS[n].toLowerCase()===String(user.email).toLowerCase())||user.email;
  S.user={uid:user.uid,name};S.mode="loading";S.projects={};S.view="overview";S.note="";
  root.innerHTML="";render();
  const timer=setTimeout(()=>{if(S.mode==="loading"){S.mode="ready";S.note="Chưa kết nối được máy chủ, đang hiển thị bản lưu trên máy.";render()}},10000);
  unsub=onSnapshot(collection(fs,"users",user.uid,"projects"),{includeMetadataChanges:false},snap=>{
    if(!snap.metadata.fromCache){clearTimeout(timer);if(S.note.startsWith("Chưa kết nối"))S.note=""}
    const next={};
    snap.docs.forEach(d=>{next[d.id]={...d.data(),id:d.id}});
    for(const id of [...pending.keys(),...saving]){if(S.projects[id])next[id]=S.projects[id];else delete next[id]}
    S.projects=next;S.mode="ready";
    if(S.view!=="overview"&&!S.projects[S.view])S.view="overview";
    const ae=document.activeElement;
    if(ae&&ae.matches&&ae.matches(".d-title,.s-title,#pjName,.notes,.te-input,.le-input")&&ae.value!==ae.defaultValue)return;
    render();
  },err=>{clearTimeout(timer);S.mode="ready";S.note="Mất kết nối dữ liệu ("+(err.code||"lỗi")+"). Tải lại trang để thử lại.";render()});
}
render();
if(!FIREBASE_CONFIG||!FIREBASE_CONFIG.apiKey){
  root.innerHTML=`<div class="login"><div class="empty"><b>Trang chưa được kết nối Firebase</b><span>Điền cấu hình vào file firebase-config.js theo hướng dẫn trong README.</span></div></div>`;
}else{
  const app=initializeApp(FIREBASE_CONFIG);
  auth=getAuth(app);
  fs=initializeFirestore(app,{localCache:persistentLocalCache()});
  onAuthStateChanged(auth,user=>{
    if(unsub){unsub();unsub=null}
    pending.forEach(t=>clearTimeout(t));pending.clear();
    S.busy=false;
    if(user){startData(user)}
    else{S.user=null;S.projects={};S.open.clear();S.mode="login";S.loginErr="";root.innerHTML="";S.refocus="#pwd";render()}
  });
}
</script>
</body>
